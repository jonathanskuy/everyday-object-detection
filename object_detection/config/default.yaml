# Project configuration. Loaded by object_detection/config/loader.py.
#
# Keys under `model`, `train` and `inference` deliberately use Ultralytics'
# own argument names (imgsz, batch, conf, ...) so each value maps 1:1 onto
# model.train(...) / model.predict(...) and can be looked up in their docs.
#
# Relative paths are resolved against the repository root, not the current
# working directory, so the same config works from notebooks/ and scripts/.

model:
  # Pretrained checkpoint to fine-tune. The letter is the model size:
  # n(ano) < s(mall) < m(edium) < l(arge) < x(tra large) — bigger is more
  # accurate but slower. Resolved against the repo root like the paths
  # below. If the file is missing, Ultralytics downloads it to this exact
  # path, so the filename must be one of its official assets (yolo26n.pt,
  # yolo26s.pt, ...). A bare name would instead be downloaded into the
  # current working directory — notebooks/ when run from a notebook.
  weights: weights/yolo26n.pt

train:
  epochs: 100
  batch: 16
  imgsz: 640   # training/inference image size in pixels (square)
  seed: 42

data:
  # Original Roboflow export, all 8 object classes. Never modified — its
  # per-class labels will seed the Stage 2 reference index.
  source_yaml: datasets/raw_export/data.yaml
  # Single-class copy the detector trains on (output of the collapse step).
  # Does not exist until that step has run.
  detector_yaml: datasets/collapsed/data.yaml

inference:
  # Trained detector used for inference (notebooks and the API).
  # Point this at a new run's best.pt after retraining.
  weights: runs/baseline/weights/best.pt
  # Minimum detection confidence (Ultralytics' default is 0.25). Chosen in
  # notebooks/02_evaluation.ipynb on the validation set, leaning towards
  # recall: Stage 2 can reject a false box, but never recover a missed
  # object. Re-check on a test split once one exists. The API reads this at
  # startup, so restart the server after changing it.
  conf: 0.5
