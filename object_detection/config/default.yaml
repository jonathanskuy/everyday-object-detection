# Project configuration. Loaded by object_detection/config/loader.py.
#
# Keys under `model`, `train` and `inference` deliberately use Ultralytics'
# own argument names (imgsz, batch, conf, ...) so each value maps 1:1 onto
# model.train(...) / model.predict(...) and can be looked up in their docs.
#
# Relative paths are resolved against the repository root, not the current
# working directory, so the same config works from notebooks/ and scripts/.

model:
  # Pretrained checkpoint to fine-tune. The letter is the model size:
  # n(ano) < s(mall) < m(edium) < l(arge) < x(tra large) — bigger is more
  # accurate but slower. Resolved against the repo root like the paths
  # below. If the file is missing, Ultralytics downloads it to this exact
  # path, so the filename must be one of its official assets (yolo26n.pt,
  # yolo26s.pt, ...). A bare name would instead be downloaded into the
  # current working directory — notebooks/ when run from a notebook.
  weights: weights/yolo26n.pt

train:
  epochs: 100
  batch: 16
  imgsz: 640   # training/inference image size in pixels (square)
  seed: 42
  # Name of the run folder, written to runs/<name>/. Ultralytics never
  # overwrites a run: if runs/<name>/ already exists, it writes to
  # runs/<name>-2/ instead. Give each experiment its own name (e.g.
  # "more-overlap-data"), then point inference.weights at its best.pt.
  name: baseline

data:
  # Original Roboflow export, all 8 object classes. Never modified — its
  # per-class labels will seed the Stage 2 reference index.
  source_yaml: datasets/raw_export/data.yaml
  # Single-class copy the detector trains on (output of the collapse step).
  # Does not exist until that step has run.
  detector_yaml: datasets/collapsed/data.yaml

inference:
  # Trained detector used for inference (notebooks and the API).
  # Point this at a new run's best.pt after retraining.
  weights: runs/baseline/weights/best.pt
  # Minimum detection confidence (Ultralytics' default is 0.25). Chosen in
  # notebooks/02_evaluation.ipynb on the validation set, leaning towards
  # recall: Stage 2 can reject a false box, but never recover a missed
  # object. Re-check on a test split once one exists. The API reads this at
  # startup, so restart the server after changing it.
  conf: 0.5

# Stage 2: which object each detection is, by embedding its crop and
# searching the reference index.
identification:
  # How each detection is cut out before embedding. Reference crops and
  # query crops must use the SAME values, or their vectors stop being
  # comparable — rebuild the index after changing either of these.
  crop_padding: 0.1     # extra context per side, as a fraction of the box
  min_crop_size: 16     # boxes smaller than this (pixels) are not identified

  # Which embedder turns crops into vectors: "fastembed" or "dinov2".
  embedder: fastembed
  # For fastembed, one of its image models (Unicom is built for image
  # retrieval; clip-ViT-B-32-vision and resnet50-onnx are the alternatives).
  # For dinov2, a Hugging Face name such as facebook/dinov2-base.
  # Vectors from different models are NOT comparable: changing this means
  # rebuilding the index.
  model: Qdrant/Unicom-ViT-B-16
  # Input size in pixels for the dinov2 embedder (must be a multiple of 14).
  # Larger keeps more detail — a padded crop of a long object leaves it small
  # in the square — but is slower. Ignored by fastembed, whose models each
  # have their own fixed input size.
  image_size: 224

  # Where the vector index lives. A folder (resolved against the repo root)
  # uses Qdrant's local mode: no server, but only one process at a time.
  # Switch to a URL like http://localhost:6333 for a Qdrant server in Docker
  # when several processes need the index (API workers, or an admin tool
  # writing while the API reads). Nothing else changes.
  qdrant_location: qdrant_data
  collection: reference_objects

  # Minimum similarity (0-1) for a match to be accepted. Below it, the item
  # is reported as unknown rather than named as the closest reference.
  # PROVISIONAL: this has to be chosen by measurement, like `conf`, and the
  # right value differs per embedding model.
  unknown_threshold: 0.5
